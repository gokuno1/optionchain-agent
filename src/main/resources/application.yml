spring:
  application:
    name: upstox-optionchain
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/upstox-optionchain}

scheduler:
  enabled: true
  index: "Nifty 50"

llm:
  enabled: true
  # Timeout for LLM API call (seconds). Prevents long waits; increase if model is slow.
  timeout-seconds: 90

upstox:
  baseUrl: https://api.upstox.com/v2
  apiVersion: v2
  userId: userId
  apiKey: ${UPSTOX_API_KEY}
  apiSecret: ${UPSTOX_API_SECRET}
  redirectUri: ${UPSTOX_REDIRECT_URI}
  # Optional: path to JSON file for token persistence (default: tokens.json in current working directory)
  tokenFilePath: ${UPSTOX_TOKEN_FILE:}
